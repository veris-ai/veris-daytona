name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Build first, and not as a matter of taste: dist/ is gitignored, and the
      # SDK's `types` points into it. On a clean checkout the workspace link
      # exists but the .d.ts does not, so the plugin's tsc cannot resolve
      # @veris-ai/daytona and fails with twenty errors that all trace back to
      # that one. Typechecking before building only ever passes on a machine
      # with a stale dist/ lying around.
      - run: npm run build
      # Typechecks both packages, which is what proves the plugin's one-line
      # import against the SDK still resolves.
      - run: npm run typecheck
      - run: npm test

  # Lints the PR title, not the commits in the PR. This repo squash-merges --
  # every commit on main carries a `(#N)` -- so the PR title is the subject that
  # actually lands in history, and the individual commit messages are discarded
  # by the merge. Linting those would gate text nobody ever reads.
  #
  # Dependabot is exempt. Its titles are structurally conventional and always
  # correctly scoped -- `chore(deps): Bump x from a to b` -- but capitalised,
  # which config-conventional rejects under subject-case. That format is not
  # configurable, so enforcing the rule here does not improve a single commit
  # message; it just blocks every dependency update, which is what it did to
  # all six of the first batch.
  commits:
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # commitlint comes from the lockfile rather than `npx --yes`, which would
      # fetch an unpinned version of a tool that runs on every PR.
      - name: PR title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | npx commitlint
