# Publishes both packages to npm, in order.
#
# Two ways in, same job. Publishing a GitHub release runs it against that
# release's tag -- creating the release *is* the release, which is what anyone
# would expect and what happens if you never open the Actions tab. Dispatching
# it by hand does the same thing from the default branch, and is also how a
# half-finished run gets retried.
#
# The version comes from the release tag (minus its `v`) on a release event,
# and from veris-daytona/package.json on a dispatch. Both packages version
# together, so `npm run version:set <v>` is the single place it is bumped. The
# flow is: bump in a PR, merge, then cut the release from the merged commit.
# The inputs exist only to override that in an emergency.
#
# The release this workflow creates at the end does not re-trigger it: GitHub
# does not start workflow runs from events raised with the default GITHUB_TOKEN.
# So a dispatch that ends in `gh release create` stops there, and the loop the
# release trigger looks like it should cause cannot happen.
#
# Order matters: @veris-ai/daytona goes first, because
# @veris-ai/daytona-opencode depends on it at the same version. Publishing the
# plugin against an SDK version npm does not have yet gives anyone who installs
# it an unresolvable dependency.
#
# This workflow is the only way to publish. It is also re-runnable: every step
# that touches the outside world -- the two publishes, the git tag, the GitHub
# release -- checks first whether it has already been done. A run that gets
# half-way and fails can be re-run and it will finish the other half rather
# than aborting on the half that succeeded.
#
# Auth is npm trusted publishing (OIDC): configure once on npmjs.com under each
# package's Settings -> Trusted Publisher (repo veris-ai/veris-daytona, workflow
# release.yml). No token, no secret; npm's 2FA rules do not apply to OIDC and
# provenance comes for free.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Override version (default: the version in veris-daytona/package.json)"
        required: false
      dist_tag:
        description: "Override the npm dist-tag (default: derived from the version)"
        required: false
      dry_run:
        description: "Build, pack and inspect, but do not publish"
        type: boolean
        default: false

permissions:
  contents: read

# Publish-then-tag is not atomic, and two dispatches racing through it is the
# one way to reach a state the per-package guard below cannot untangle. Queue
# rather than cancel: cancelling mid-publish is exactly what we are avoiding.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag + GitHub release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No registry-url: it makes setup-node write an .npmrc pinning token auth
      # to a placeholder NODE_AUTH_TOKEN, and npm then never reaches for OIDC.
      # The default registry is npmjs.org anyway, which is where this publishes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm ci

      # The dist-tag is resolved here, not at publish time, because npm 11
      # (RFC 7) hard-errors on a prerelease published without an explicit
      # --tag rather than silently putting it on `latest`. Deriving it early
      # means a bad tag fails before the build instead of after it.
      #
      # The event's own fields go through env rather than `${{ }}`: a git tag
      # may legally contain a single quote, and interpolated into the quoted
      # assignment below that would end the string and run the rest as shell.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DIST_TAG: ${{ inputs.dist_tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION="$INPUT_VERSION"
          # On a release event the tag is the statement of intent -- the release
          # says which version it is, and the check below then holds the tagged
          # commit's package.json to it rather than the other way round.
          [ -n "$VERSION" ] || VERSION="${RELEASE_TAG#v}"
          [ -n "$VERSION" ] || VERSION="$(jq -r .version veris-daytona/package.json)"

          TAG="$INPUT_DIST_TAG"
          if [ -z "$TAG" ]; then
            case "$VERSION" in
              # 0.2.0-rc.1 -> rc, 0.2.0-alpha.3 -> alpha
              *-*) TAG="${VERSION#*-}"; TAG="${TAG%%.*}" ;;
              *)   TAG=latest ;;
            esac
          fi

          # npm refuses a dist-tag that parses as a semver range, so 0.2.0-0
          # would derive the tag `0` and die at the publish step -- the late
          # failure this whole step exists to remove. Fail here instead, and
          # say what to do about it.
          #
          # POSIX classes rather than [a-z]: a bracket *range* is collated by
          # locale, and under en_US.UTF-8 [a-z] matches uppercase too, so
          # 0.2.0-RC.1 would slip past a range-based check.
          if [[ ! "$TAG" =~ ^[[:alpha:]][[:alnum:]-]*$ ]]; then
            echo "::error::'$TAG' is not a usable npm dist-tag — it must start with a letter and hold only letters, digits and hyphens. Pass dist_tag explicitly to override." >&2
            exit 1
          fi

          # A release can be published from any tag, and a tag is free text.
          # Without this, `nightly` resolves to version "nightly", derives the
          # dist-tag `latest`, and dies two steps later complaining that
          # package.json disagrees -- true, but not the actual mistake.
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semver version — a release must be tagged vMAJOR.MINOR.PATCH (a leading 'v' is optional)." >&2
            exit 1
          fi

          # GitHub's prerelease checkbox and the npm dist-tag are two claims
          # about the same release, made in two places by hand. Disagreement
          # means one of them is wrong, and the expensive direction is silent:
          # ticking "pre-release" on v0.3.0 still moves npm's `latest` onto it,
          # so everyone installing the package gets it. Checked only for a
          # release event -- a dispatch has no checkbox to disagree with.
          if [ '${{ github.event_name }}' = release ] && [ -z "$INPUT_DIST_TAG" ]; then
            if [ "$RELEASE_PRERELEASE" = true ] && [ "$TAG" = latest ]; then
              echo "::error::the GitHub release is marked pre-release but $VERSION would publish to npm's 'latest' — either untick it, or tag the release with a prerelease version like $VERSION-rc.1." >&2
              exit 1
            fi
            if [ "$RELEASE_PRERELEASE" != true ] && [ "$TAG" != latest ]; then
              echo "::error::$VERSION is a prerelease (npm dist-tag '$TAG') but the GitHub release is not marked pre-release — tick 'Set as a pre-release', or release a stable version." >&2
              exit 1
            fi
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing @veris-ai/daytona@$VERSION and @veris-ai/daytona-opencode@$VERSION under dist-tag '$TAG'"

      # An override, or a half-applied bump, can leave the two packages on
      # different versions or the plugin depending on an SDK version that is not
      # the one being published. Either ships a broken install.
      - name: Both packages agree on the version
        run: |
          V='${{ steps.version.outputs.version }}'
          node scripts/version.mjs "$V"
          git diff --quiet -- veris-daytona/package.json daytona-opencode/package.json || {
            echo "::error::the commit this ran on is not bumped to $V — run 'npm run version:set $V', merge it, and cut the release tag from that commit." >&2
            git --no-pager diff -- veris-daytona/package.json daytona-opencode/package.json
            exit 1
          }
          DEP="$(jq -r '.dependencies["@veris-ai/daytona"]' daytona-opencode/package.json)"
          [ "$DEP" = "^$V" ] || { echo "::error::plugin depends on $DEP, expected ^$V" >&2; exit 1; }

      # Per package, not all-or-nothing. The all-or-nothing version of this
      # check made a partial release unrecoverable: if the SDK published and the
      # plugin then failed, the retry aborted here on the SDK it had just
      # successfully published, and the only ways out were publishing the plugin
      # by hand or burning a version on both. Changesets and pnpm invert the
      # check for exactly this reason -- skip what is published, publish the
      # rest -- which is what makes their publish safe to re-run blindly.
      #
      # "Both already published" is a warning, not a failure. It was a failure
      # once, and that cost us: the 0.1.1 run published both packages and then
      # tripped on a provenance check this workflow has since dropped, so the
      # tag and GitHub release
      # never ran -- and the re-run that would have created them aborted here
      # instead, because by then both packages were up. A step that exists to
      # make retries safe must not itself be the thing that blocks one. Every
      # step after this is individually idempotent, so a run with nothing left
      # to publish is a legitimate no-op that still repairs a missing tag.
      #
      # `npm view pkg@ver version` exits 0 with a version on stdout when it is
      # published and 1 (E404) when the version or the package is absent. Only
      # "exit 0 and non-empty" counts as published, so a network flake falls
      # through to the publish, where npm rejects a genuine duplicate with
      # EPUBLISHCONFLICT. Fails safe in the direction that cannot lose data.
      #
      # Skipped on a dry run: a dry run clobbers nothing, and not gating on the
      # registry is what makes dry_run usable as a rehearsal from an already
      # released state rather than only from a freshly bumped one.
      - name: What is left to publish
        id: plan
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V='${{ steps.version.outputs.version }}'
          LEFT=0

          published() {
            local out
            out="$(npm view "$1@$V" version 2>/dev/null)" || return 1
            [ -n "$out" ]
          }

          for entry in "publish_sdk:@veris-ai/daytona" "publish_plugin:@veris-ai/daytona-opencode"; do
            key="${entry%%:*}"
            pkg="${entry#*:}"
            if published "$pkg"; then
              echo "::notice::$pkg@$V is already on npm — skipping its publish"
              echo "$key=false" >> "$GITHUB_OUTPUT"
            else
              echo "$pkg@$V is not on npm — will publish"
              echo "$key=true" >> "$GITHUB_OUTPUT"
              LEFT=$((LEFT + 1))
            fi
          done

          [ "$LEFT" -eq 0 ] || exit 0

          # Both are up. Whether that is an error depends on the rest of the
          # release: if the tag and its GitHub release are also there, the
          # version is fully shipped and this dispatch is a mistake. If either
          # is missing, an earlier run died after its publishes and this one is
          # here to finish the job.
          TAG="v$V"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 \
             && gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::nothing to do — $V is fully released: both packages on npm, tag $TAG and its GitHub release both present. Bump with 'npm run version:set' first." >&2
            exit 1
          fi
          echo "::notice::both packages are already on npm at $V — continuing, to finish the tag and GitHub release an earlier run left behind"

      # Build first: dist/ is gitignored and the SDK's `types` points into it,
      # so on a clean checkout nothing can typecheck against @veris-ai/daytona
      # until it has been built. It also has to precede the pack below, which
      # asserts on files the build produces.
      #
      # Unconditional, including on a retry: a re-run should re-prove the
      # artifacts rather than trust the run that failed.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # The SDK ships dist/, the plugin ships compiled .opencode/plugin. Both
      # declare README.md in `files` and shipping without one leaves a blank npm
      # page — which is exactly what would have happened before this check.
      #
      # The node_modules and size checks are the backstop: `files` entries are
      # directories, so a stray nested install would be shipped wholesale, and
      # the ceiling is what catches that (and anything like it) before npm does.
      # Both tarballs are around 70 KB today, so 1 MB is roughly 14x headroom.
      - name: Pack and inspect
        run: |
          V='${{ steps.version.outputs.version }}'
          MAX_BYTES=1048576
          LISTING=

          # Listed once into a variable rather than re-running `tar | grep` per
          # assertion. Not just for speed: `grep -q` exits on its first match,
          # which SIGPIPEs tar, and under `set -o pipefail` that makes the
          # pipeline non-zero even on a successful match. These tarballs are
          # small enough that tar's output fits the pipe buffer and it never
          # notices -- but that is the pipe buffer holding the check up, not the
          # code. A herestring has no pipeline and no such dependency.
          listing() {
            local label="$1" tgz="$2" bytes
            LISTING="$(tar -tzf "$tgz")"
            if grep -q 'node_modules/' <<<"$LISTING"; then
              echo "::error::$label tarball contains node_modules" >&2
              grep 'node_modules/' <<<"$LISTING" | head >&2
              exit 1
            fi
            bytes="$(wc -c < "$tgz" | tr -d ' ')"
            if [ "$bytes" -gt "$MAX_BYTES" ]; then
              echo "::error::$label tarball is $bytes bytes, over the $MAX_BYTES ceiling" >&2
              exit 1
            fi
            echo "$label tarball: $bytes bytes, $(wc -l <<<"$LISTING" | tr -d ' ') files"
          }

          has() {
            grep -qF "$1" <<<"$LISTING" || { echo "::error::$2" >&2; exit 1; }
          }

          ( cd veris-daytona && npm pack )
          listing SDK "veris-daytona/veris-ai-daytona-$V.tgz"
          has 'package/dist/index.js'   "dist/index.js missing from the SDK tarball"
          has 'package/dist/index.d.ts' "type declarations missing from the SDK tarball"
          has 'package/README.md'       "README missing from the SDK tarball"
          echo "$LISTING"

          ( cd daytona-opencode && npm pack )
          listing plugin "daytona-opencode/veris-ai-daytona-opencode-$V.tgz"
          has 'package/.opencode/plugin/index.js'                       "plugin entrypoint missing from the tarball"
          has 'package/.opencode/plugin/daytona/tools/veris-receipt.js' "verisReceipt missing from the tarball"
          has 'package/.opencode/plugin/daytona/tools/veris-twin.js'    "verisTwin missing from the tarball"
          has 'package/.opencode/plugin/daytona/plugins/veris-config.js' "the MCP config hook is missing from the tarball"
          has 'package/README.md'                                       "README missing from the plugin tarball"
          echo "$LISTING"

      - name: Publish @veris-ai/daytona
        if: ${{ !inputs.dry_run && steps.plan.outputs.publish_sdk == 'true' }}
        working-directory: veris-daytona
        run: npm publish --tag '${{ steps.version.outputs.dist_tag }}'

      # Second, and only after the SDK is on npm: the plugin depends on it.
      - name: Publish @veris-ai/daytona-opencode
        if: ${{ !inputs.dry_run && steps.plan.outputs.publish_plugin == 'true' }}
        working-directory: daytona-opencode
        run: npm publish --tag '${{ steps.version.outputs.dist_tag }}'

      # Deliberately NO assertion that the provenance attestation landed. One
      # used to live here, polling dist.attestations for five minutes: the
      # registry attaches the attestation minutes after publish with no SLA,
      # and the poll failed the 0.2.0 and 0.2.1 runs back to back on packages
      # that were in fact correctly attested. A guard that red-flags healthy
      # releases teaches people to ignore red, which is worse than no guard.
      # If OIDC ever silently degrades to a token publish, the symptom is
      # `npm view <pkg>@<version> dist.attestations` coming back empty --
      # worth a manual spot-check after touching the Trusted Publisher
      # settings on npmjs.com.

      # Both halves are conditional for the same reason the publishes are: a
      # re-run that finishes a half-done release must not fail on the tag or the
      # release the first run already created, which would report failure on a
      # release that actually shipped.
      - name: Tag and GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V='${{ steps.version.outputs.version }}'
          TAG="v$V"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::notice::tag $TAG already exists on origin — leaving it alone"
          else
            git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || git tag "$TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG already exists — leaving it alone"
          else
            PRERELEASE=()
            [ '${{ steps.version.outputs.dist_tag }}' = latest ] || PRERELEASE=(--prerelease)
            # --generate-notes with --notes: gh puts the given notes first and
            # the generated "What's Changed" list under them.
            gh release create "$TAG" "${PRERELEASE[@]}" \
              --title "v$V" \
              --generate-notes \
              --notes "$(printf '%s\n' \
                "- https://www.npmjs.com/package/@veris-ai/daytona/v/$V" \
                "- https://www.npmjs.com/package/@veris-ai/daytona-opencode/v/$V")"
          fi
